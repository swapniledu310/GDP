name: Daily IPO GMP Excel Email

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ipo-gmp-report
  cancel-in-progress: false

jobs:
  generate-and-email:
    name: Generate and email IPO dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate IPO GMP Excel dashboard
        run: |
          python IPO_Index_GMP_Full_Colab.py

      - name: Verify Excel report
        run: |
          test -f IPO_Index_GMP_Dashboard.xlsx
          ls -lh IPO_Index_GMP_Dashboard.xlsx

      - name: Email Excel report
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python send_email.py

      - name: Preserve report in GitHub for 7 days
        if: always() && hashFiles('IPO_Index_GMP_Dashboard.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: IPO-GMP-Dashboard-${{ github.run_number }}
          path: IPO_Index_GMP_Dashboard.xlsx
          retention-days: 7
